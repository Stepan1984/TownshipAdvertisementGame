<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Farm Idle — Township Ad Style</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <div id="stage-badge">STAGE <span id="stage-num">1</span></div>
      <div id="goal-badge">
        <div id="goal-text">Sell items: 0/15</div>
        <div id="goal-bar"><div id="goal-fill"></div></div>
      </div>
      <div id="money-badge">
        <span class="bill-icon"></span>
        <span id="money-num">0</span>
      </div>
      <div id="hint">Shop at ENTER — harvest FIELD, process jars, unlock late-game east expansion</div>
    </div>
    <div id="joystick">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
